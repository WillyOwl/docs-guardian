[project]
name = "docs-guardian"
version = "0.1.0"
description = "Catches documentation that has fallen out of step with the code it describes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docs-guardian = "docs_guardian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_guardian"]

# tinyml (the Guarded Project) is a workspace member so one `uv sync` installs
# both. docs-guardian itself never imports it (ADR 0003).
[tool.uv.workspace]
members = ["tinyml"]

[tool.uv.sources]
tinyml = { workspace = true }

[dependency-groups]
dev = [
    "tinyml",
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6,<2",          # ADR 0002: Material is incompatible with MkDocs 2
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-jupyter>=0.25",
    "nbmake>=1.5",            # runs the notebook Pages in docs-tests.yml
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests", "tinyml/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tinyml/docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The tinyml/ project folder at the root confuses first-party detection.
known-first-party = ["docs_guardian", "tinyml"]
