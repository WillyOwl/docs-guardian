# Advisory: report API Changes and the Pages that Mention them as one PR comment.
# It never fails on what it finds (ADR 0001). docs-guardian is installed from this checkout.
name: drift-check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# One run per pull request at a time: a newer push cancels an older run, so two
# runs can't both post a first comment, and a stale report can't land last.
concurrency:
  group: drift-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the merge base with the target branch must be reachable
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Build the Drift Report
        run: >-
          uv run --locked --no-group docs docs-guardian drift
          --base "origin/${{ github.base_ref }}"
          --source tinyml/src --docs tinyml/docs --output drift-report.md
      - name: Show it in the job summary
        run: cat drift-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or rewrite the Drift Report comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The report's hidden first line carries the marker and the counts.
          first_line=$(head -n 1 drift-report.md)
          marker=${first_line%% changes=*}
          changes=$(sed -E 's/.* changes=([0-9]+).*/\1/' <<< "$first_line")

          # GitHub caps a comment at 65536 characters.
          limit=60000
          if [ "$(wc -c < drift-report.md)" -gt "$limit" ]; then
            head -c "$limit" drift-report.md > body.md
            printf '\n\n…truncated: the full report is in the job summary of run %s.\n' \
              "$GITHUB_RUN_ID" >> body.md
          else
            cp drift-report.md body.md
          fi

          # Only this workflow's own comment counts, never a person's that happens to match.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\")
                       | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            action="rewrite comment $existing"
            cmd=(gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@body.md)
          elif [ "$changes" != "0" ]; then
            action="post a new comment"
            cmd=(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md)
          else
            echo "No API Changes and no earlier Drift Report: nothing to post."
            exit 0
          fi

          # Advisory: a failure to comment (a fork's read-only token, an API error) only warns.
          if error=$("${cmd[@]}" 2>&1 > /dev/null); then
            echo "Drift Report: did $action."
          else
            echo "::warning::Could not $action; the report is in the job summary. GitHub said: $error"
          fi
