[project]
name = "tinyml"
version = "0.1.0"
description = "A tiny linear-regression library: the Guarded Project that docs-guardian protects."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyml"]
